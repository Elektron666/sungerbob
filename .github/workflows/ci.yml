name: CI

# Her push'ta testleri çalıştırır ve debug APK'yı indirilebilir artifact olarak yükler.
# Android SDK geliştirme ortamında kurulamadığı için (DECISIONS SK-01) APK burada derlenir.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  test:
    name: Analyze ve test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Kod üretimi (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Biçim kontrolü
        run: dart format --set-exit-if-changed lib test

      - name: flutter analyze
        run: flutter analyze

      - name: Testler
        run: flutter test --exclude-tags performance --reporter expanded

      - name: Performans ölçümü (50.000 satır)
        run: flutter test --tags performance --reporter expanded

      - name: Test kapsamı
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Debug APK derle
        run: flutter build apk --debug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: sungerbob-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
