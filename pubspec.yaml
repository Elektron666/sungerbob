name: sungerbob
description: "Sünger stok, satış, cari ve kârlılık yönetimi — offline Android uygulaması."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Para ve m3 hesaplarında double YASAK (BRIEF §2) — her şey Decimal.
  decimal: ^3.2.6

  # Yerel veritabanı. SQLCipher, sqlite3 3.x build-hook'u ile Faz 2'de devreye girer.
  drift: ^2.35.0
  sqlite3: ^3.6.0

  # UUID v7 (BRIEF §3.12)
  uuid: ^4.6.0

  collection: ^1.19.1
  crypto: ^3.0.7
  path: ^1.9.1
  meta: ^1.17.0

  # --- Faz 2: güvenlik ve yedekleme ---
  # Veritabanı anahtarı Android Keystore destekli güvenli depoda (BRIEF §2).
  flutter_secure_storage: ^11.2.0
  # Yedek şifrelemesi: AES-256-GCM + Argon2id/PBKDF2 (BRIEF §2, BACKUP.md §1.3)
  cryptography: ^2.9.0
  path_provider: ^2.1.6
  archive: ^4.3.0
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  local_auth: ^3.0.2

  # --- Faz 2: arayüz ---
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# SQLCipher ile şifreli veritabanı (BRIEF §2, DECISIONS SK-07).
# sqlite3 3.x'te yerel kütüphane build-hook ile seçilir; sqlcipher_flutter_libs
# artık kullanılmıyor.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
